<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Journal Stats</title>
  <link rel="apple-touch-icon" href="icono.png">
  <link rel="icon" type="image/png" href="icono.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
  <style>
    :root {
      --bg:       #0f0f13;
      --surface:  #17171e;
      --card:     #1e1e28;
      --border:   rgba(255,255,255,0.07);
      --txt:      #f0efe8;
      --muted:    #7a7a8c;
      --accent:   #c8b560;
      --accent2:  #6c8ebf;
      --accent3:  #b56c8e;
      --good:     #6cbf8e;
      --bad:      #bf6c6c;
      --radius:   14px;
      --font-display: 'DM Serif Display', serif;
      --font-body:    'DM Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--txt);
      font-family: var(--font-body);
      min-height: 100vh;
      padding: 0 0 80px;
    }

    /* ── HEADER ── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left h1 {
      font-family: var(--font-display);
      font-size: 26px;
      letter-spacing: -0.3px;
      color: var(--accent);
    }
    .header-left p { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .header-right { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

    /* ── CONTROLS ── */
    .btn {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      padding: 9px 18px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--txt);
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .btn:hover { background: #2a2a36; border-color: rgba(255,255,255,0.15); }
    .btn.primary { background: var(--accent); color: #0f0f13; border-color: var(--accent); }
    .btn.primary:hover { background: #d9c870; }

    .year-selector {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .year-btn {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
      transition: all .15s;
    }
    .year-btn.active {
      background: var(--accent);
      color: #0f0f13;
      border-color: var(--accent);
    }
    .year-btn:hover:not(.active) { background: #2a2a36; color: var(--txt); }

    /* ── EMPTY STATE ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 40px;
      text-align: center;
      gap: 16px;
    }
    .empty-state .icon { font-size: 56px; opacity: .4; }
    .empty-state h2 { font-family: var(--font-display); font-size: 24px; color: var(--muted); }
    .empty-state p { font-size: 14px; color: var(--muted); max-width: 340px; line-height: 1.6; }

    /* ── MAIN GRID ── */
    .main { padding: 32px; display: flex; flex-direction: column; gap: 40px; }

    /* ── SECTION ── */
    .section-title {
      font-family: var(--font-display);
      font-size: 20px;
      color: var(--accent);
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    /* ── TABLE ── */
    .table-chart-block {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .table-chart-block { grid-template-columns: 1fr; }
    }

    .data-table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .data-table-title {
      padding: 14px 18px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.02);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th {
      padding: 10px 12px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 9px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    td.month-col { color: var(--muted); font-size: 12px; font-weight: 600; }
    td.val { font-variant-numeric: tabular-nums; }
    td.val-accent { color: var(--accent); font-weight: 600; }
    td.bar-cell { width: 120px; }
    .mini-bar-bg { background: rgba(255,255,255,0.06); border-radius: 3px; height: 6px; }
    .mini-bar-fill { height: 6px; border-radius: 3px; background: var(--accent); transition: width .4s; }

    /* multi-col tables (emotions/activities) */
    .multi-table th, .multi-table td { padding: 8px 10px; font-size: 12px; }
    .multi-table th:first-child, .multi-table td:first-child { position: sticky; left: 0; background: var(--card); z-index:1; }
    .scroll-x { overflow-x: auto; }

    /* ── CHART CARD ── */
    .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .chart-card-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .chart-wrap { position: relative; height: 260px; }
    .chart-wrap-tall { position: relative; height: 320px; }
    .chart-wrap-ribbon { position: relative; height: 360px; width: 100%; }

    /* heatmap */
    .emotion-heatmap { display: flex; flex-direction: column; gap: 4px; }
    .heatmap-row { display: flex; gap: 4px; align-items: center; }
    .heatmap-label { font-size: 11px; color: var(--muted); width: 130px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .heatmap-cells { display: flex; gap: 3px; }
    .heatmap-cell {
      width: 22px; height: 22px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 600; color: rgba(255,255,255,0.6);
      cursor: default;
    }

    /* ── SUMMARY PILLS ── */
    .summary-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .summary-pill {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 20px;
      flex: 1;
      min-width: 120px;
    }
    .pill-value { font-family: var(--font-display); font-size: 28px; color: var(--accent); }
    .pill-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }

    input[type=file] { display: none; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Journal Stats</h1>
    <p id="headerSub">Import your journal to get started</p>
  </div>
  <div class="header-right">
    <div class="year-selector" id="yearSelector"></div>
    <input type="file" id="fileInput" accept=".json">
    <button class="btn primary" onclick="document.getElementById('fileInput').click()">Import JSON</button>
  </div>
</div>

<div id="appContent">
  <div class="empty-state">
    <h2>No data yet</h2>
    <p>Import the JSON exported from Refy Journal to visualize yearly summaries.</p>
  </div>
</div>

<script>
(function() {
  "use strict";

  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var MONTHS_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  var ACTIVITY_MIGRATIONS = {
    "School/work": ["School", "Work"],
    "Relationship": ["Relationships"],
    "Friends/colleagues": ["Friends", "Colleagues"],
    "Relaxing": ["Rest"]
  };
  var EMOTION_MIGRATIONS = {
    "Good": ["Content"],
    "Confused/thoughtful": ["Confused", "Thoughtful"],
    "Bored/tired/neutral": ["Bored", "Tired", "Neutral"],
    "Angry/ pissed": ["Angry", "Irritated"]
  };

  var STORAGE_KEY = "journal-stats:v1";
  var allEntries = [];
  var importedActivities = [];
  var importedEmotions = [];
  var currentYear = null;
  var charts = {};

  function uniqueClean(list) {
    var seen = {};
    var out = [];
    (list || []).forEach(function(item) {
      var clean = String(item || "").trim();
      if (!clean || seen[clean.toLowerCase()]) return;
      seen[clean.toLowerCase()] = true;
      out.push(clean);
    });
    return out;
  }

  function migrateTagList(list, migrations) {
    var out = [];
    (list || []).forEach(function(tag) {
      var mapped = migrations[tag];
      if (mapped) out = out.concat(mapped);
      else out.push(tag);
    });
    return uniqueClean(out);
  }

  function normalizeEntry(entry) {
    return {
      date: String(entry.date || ""),
      title: String(entry.title || ""),
      text: String(entry.text || ""),
      score: Number(entry.score || 0),
      activities: migrateTagList(entry.activities || [], ACTIVITY_MIGRATIONS),
      emotions: migrateTagList(entry.emotions || [], EMOTION_MIGRATIONS)
    };
  }

  function normalizeEntries(list) {
    return (Array.isArray(list) ? list : [])
      .filter(function(e) { return e && typeof e.date === "string" && e.date.length >= 10; })
      .map(normalizeEntry)
      .sort(function(a, b) { return a.date.localeCompare(b.date); });
  }

  function parseImportPayload(data) {
    if (Array.isArray(data)) {
      return {
        entries: normalizeEntries(data),
        activities: [],
        emotions: []
      };
    }
    if (data && Array.isArray(data.entries)) {
      return {
        entries: normalizeEntries(data.entries),
        activities: migrateTagList(data.activities || [], ACTIVITY_MIGRATIONS),
        emotions: migrateTagList(data.emotions || [], EMOTION_MIGRATIONS)
      };
    }
    throw new Error("Invalid journal export.");
  }

  function uniqueTagsFromEntries(list, field) {
    var out = [];
    var seen = {};
    (list || []).forEach(function(entry) {
      (entry[field] || []).forEach(function(tag) {
        var clean = String(tag || "").trim();
        if (!clean || seen[clean.toLowerCase()]) return;
        seen[clean.toLowerCase()] = true;
        out.push(clean);
      });
    });
    return out.sort(function(a, b) { return a.localeCompare(b); });
  }

  function tagsForEntries(list, field, importedTags) {
    var activeInPeriod = uniqueTagsFromEntries(list, field);
    var imported = uniqueClean(importedTags || []);
    var used = {};
    activeInPeriod.forEach(function(tag) { used[tag.toLowerCase()] = true; });
    var labels = activeInPeriod.slice();

    // Include imported active tags only if they appear somewhere in the full dataset.
    imported.forEach(function(tag) {
      if (used[tag.toLowerCase()]) return;
      var appears = allEntries.some(function(entry) {
        return (entry[field] || []).some(function(x) { return x.toLowerCase() === tag.toLowerCase(); });
      });
      if (appears) labels.push(tag);
    });

    return uniqueClean(labels).sort(function(a, b) { return a.localeCompare(b); });
  }

  // ── IMPORT ─────────────────────────────────────────────
  document.getElementById("fileInput").addEventListener("change", function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var data = JSON.parse(ev.target.result);
        var parsed = parseImportPayload(data);
        allEntries = parsed.entries;
        importedActivities = parsed.activities;
        importedEmotions = parsed.emotions;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            version: 2,
            entries: allEntries,
            activities: importedActivities,
            emotions: importedEmotions
          }));
        } catch(se) {}
        init();
      } catch(err) {
        alert("Could not import JSON: " + err.message);
      }
      e.target.value = "";
    };
    reader.readAsText(file);
  });

  // ── LOAD FROM LOCALSTORAGE ──────────────────────────────
  (function() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var data = JSON.parse(raw);
        var parsed = parseImportPayload(data);
        if (parsed.entries.length > 0) {
          allEntries = parsed.entries;
          importedActivities = parsed.activities;
          importedEmotions = parsed.emotions;
          init();
        }
      }
    } catch(e) {}
  })();

  function init() {
    var years = getYears();
    if (!years.length) { alert("No valid entries found."); return; }
    currentYear = years[years.length - 1]; // most recent
    renderYearSelector(years);
    document.getElementById("headerSub").textContent = allEntries.length + " entries · " + years.length + " years";
    renderYear(currentYear);
  }

  function getYears() {
    var ys = {};
    allEntries.forEach(function(e) { ys[e.date.slice(0,4)] = true; });
    return Object.keys(ys).sort();
  }

  function renderYearSelector(years) {
    var sel = document.getElementById("yearSelector");
    sel.innerHTML = "";
    years.forEach(function(y) {
      var btn = document.createElement("button");
      btn.className = "year-btn" + (y === currentYear ? " active" : "");
      btn.textContent = y;
      btn.onclick = function() {
        currentYear = y;
        document.querySelectorAll(".year-btn").forEach(function(b) { b.classList.remove("active"); });
        btn.classList.add("active");
        renderYear(y);
      };
      sel.appendChild(btn);
    });
  }

  // ── COMPUTE ────────────────────────────────────────────
  function entriesForYear(year) {
    return allEntries.filter(function(e) { return e.date.startsWith(year); });
  }

  function computeMonthly(year, activityLabels, emotionLabels) {
    var data = [];
    for (var m = 0; m < 12; m++) {
      var monthStr = year + "-" + String(m+1).padStart(2,"0");
      var monthEntries = allEntries.filter(function(e) { return e.date.startsWith(monthStr); });
      if (!monthEntries.length) { data.push(null); continue; }

      var scores = monthEntries.map(function(e) { return e.score || 0; });
      var avg = scores.reduce(function(a,b){return a+b;},0) / scores.length;
      var variance = scores.reduce(function(s,v){var d=v-avg;return s+d*d;},0) / scores.length;
      var range = Math.max.apply(null,scores) - Math.min.apply(null,scores);

      var totalEmoCount = monthEntries.reduce(function(s,e){return s+(e.emotions||[]).length;},0);
      var totalActCount = monthEntries.reduce(function(s,e){return s+(e.activities||[]).length;},0);

      var emoPct = {};
      emotionLabels.forEach(function(em) {
        var days = monthEntries.filter(function(e){return (e.emotions||[]).indexOf(em)>=0;}).length;
        emoPct[em] = totalEmoCount > 0 ? (days / totalEmoCount) * 100 : 0;
      });
      var actPct = {};
      activityLabels.forEach(function(a) {
        var days = monthEntries.filter(function(e){return (e.activities||[]).indexOf(a)>=0;}).length;
        actPct[a] = totalActCount > 0 ? (days / totalActCount) * 100 : 0;
      });

      var emoDensity = totalEmoCount / monthEntries.length;
      var actDensity = totalActCount / monthEntries.length;

      data.push({
        month: m,
        n: monthEntries.length,
        avg: avg,
        variance: variance,
        range: range,
        emoPct: emoPct,
        actPct: actPct,
        emoDensity: emoDensity,
        actDensity: actDensity
      });
    }
    return data;
  }

  // ── RENDER YEAR ────────────────────────────────────────
  function renderYear(year) {
    // destroy old charts
    Object.keys(charts).forEach(function(k) {
      try { charts[k].destroy(); } catch(e){}
    });
    charts = {};

    var yeEntries = entriesForYear(year);
    var activityLabels = tagsForEntries(yeEntries, "activities", importedActivities);
    var emotionLabels = tagsForEntries(yeEntries, "emotions", importedEmotions);
    var monthly = computeMonthly(year, activityLabels, emotionLabels);
    var content = document.getElementById("appContent");
    content.innerHTML = "";

    var main = document.createElement("div");
    main.className = "main";

    // Summary pills
    var activeMos = monthly.filter(function(m){return m !== null;});
    var totalEntries = yeEntries.length;
    var yearAvg = activeMos.length ? activeMos.reduce(function(s,m){return s+m.avg;},0)/activeMos.length : 0;
    var yearVar = activeMos.length ? activeMos.reduce(function(s,m){return s+m.variance;},0)/activeMos.length : 0;
    var bestMo = activeMos.reduce(function(b,m){return m.avg>b.avg?m:b;}, activeMos[0]);

    main.appendChild(makePills([
      { value: totalEntries, label: "Entries" },
      { value: yearAvg.toFixed(2), label: "Average mood" },
      { value: yearVar.toFixed(2), label: "Average variance" },
      { value: bestMo ? MONTHS[bestMo.month] : "-", label: "Best month" }
    ]));

    main.appendChild(makeSection("1 · Monthly average mood",
      makeSimpleTable(monthly, "avg", "Average", function(v){return v.toFixed(3);}, true),
      makeLineChart("chartAvg", monthly, function(m){return m.avg;}, "Average mood", "#c8b560")
    ));

    main.appendChild(makeSection("2 · Monthly variance",
      makeSimpleTable(monthly, "variance", "Variance", function(v){return v.toFixed(3);}, false),
      makeLineChart("chartVar", monthly, function(m){return m.variance;}, "Variance", "#6c8ebf")
    ));

    main.appendChild(makeSection("3 · Monthly score range",
      makeSimpleTable(monthly, "range", "Range", function(v){return v.toFixed(2);}, false),
      makeLineChart("chartRange", monthly, function(m){return m.range;}, "Range", "#b56c8e")
    ));

    main.appendChild(makeMultiSection("4 · Emotion share (%)", monthly, emotionLabels, "emoPct", "#b56c8e", "emo"));

    main.appendChild(makeMultiSection("5 · Activity share (%)", monthly, activityLabels, "actPct", "#6cbf8e", "act"));

    main.appendChild(makeSection("6 · Emotion density (average/day)",
      makeSimpleTable(monthly, "emoDensity", "Density", function(v){return v.toFixed(2);}, false),
      makeLineChart("chartEmoDensity", monthly, function(m){return m.emoDensity;}, "Emotions/day", "#b56c8e")
    ));

    main.appendChild(makeSection("7 · Activity density (average/day)",
      makeSimpleTable(monthly, "actDensity", "Density", function(v){return v.toFixed(2);}, false),
      makeLineChart("chartActDensity", monthly, function(m){return m.actDensity;}, "Activities/day", "#6cbf8e")
    ));

    content.appendChild(main);

    // render charts after DOM insertion
    requestAnimationFrame(function() {
      renderChart("chartAvg", monthly, function(m){return m ? parseFloat(m.avg.toFixed(2)) : null;}, "Average mood", "#c8b560");
      renderChart("chartVar", monthly, function(m){return m ? parseFloat(m.variance.toFixed(3)) : null;}, "Variance", "#6c8ebf");
      renderChart("chartRange", monthly, function(m){return m ? parseFloat(m.range.toFixed(2)) : null;}, "Range", "#b56c8e");
      renderChart("chartEmoDensity", monthly, function(m){return m ? parseFloat(m.emoDensity.toFixed(2)) : null;}, "Emotions/day", "#b56c8e");
      renderChart("chartActDensity", monthly, function(m){return m ? parseFloat(m.actDensity.toFixed(2)) : null;}, "Activities/day", "#6cbf8e");
      renderMultiBarChart("chartEmo", monthly, emotionLabels, "emoPct", "#b56c8e");
      renderMultiBarChart("chartAct", monthly, activityLabels, "actPct", "#6cbf8e");
    });
  }

  // ── UI BUILDERS ────────────────────────────────────────
  function makePills(items) {
    var row = document.createElement("div");
    row.className = "summary-row";
    items.forEach(function(item) {
      var pill = document.createElement("div");
      pill.className = "summary-pill";
      pill.innerHTML = '<div class="pill-value">' + item.value + '</div><div class="pill-label">' + item.label + '</div>';
      row.appendChild(pill);
    });
    return row;
  }

  function makeSection(title, tableEl, chartEl) {
    var wrap = document.createElement("div");
    var h = document.createElement("div");
    h.className = "section-title";
    h.textContent = title;
    wrap.appendChild(h);
    var block = document.createElement("div");
    block.className = "table-chart-block";
    block.appendChild(tableEl);
    block.appendChild(chartEl);
    wrap.appendChild(block);
    return wrap;
  }

  function makeMultiSection(title, monthly, items, key, color, chartId) {
    var wrap = document.createElement("div");
    var h = document.createElement("div");
    h.className = "section-title";
    h.textContent = title;
    wrap.appendChild(h);
    var block = document.createElement("div");
    block.className = "table-chart-block";
    block.appendChild(makeMultiTable(monthly, items, key));
    block.appendChild(makeBarChartCard("chart" + chartId.charAt(0).toUpperCase() + chartId.slice(1), title));
    wrap.appendChild(block);
    return wrap;
  }

  function makeSimpleTable(monthly, key, colLabel, fmt, showBar) {
    var wrap = document.createElement("div");
    wrap.className = "data-table-wrap";
    var titleEl = document.createElement("div");
    titleEl.className = "data-table-title";
    titleEl.textContent = colLabel + " by month";
    wrap.appendChild(titleEl);

    var vals = monthly.map(function(m) { return m ? m[key] : null; });
    var max = Math.max.apply(null, vals.filter(function(v){return v!==null;})) || 1;

    var table = document.createElement("table");
    var thead = "<thead><tr><th>Month</th><th>" + colLabel + "</th><th>N</th>" + (showBar ? "<th>Bar</th>" : "") + "</tr></thead>";
    table.innerHTML = thead;
    var tbody = document.createElement("tbody");

    monthly.forEach(function(m, i) {
      var tr = document.createElement("tr");
      if (!m) {
        tr.innerHTML = '<td class="month-col">' + MONTHS[i] + '</td><td class="val muted" colspan="' + (showBar?3:2) + '" style="color:var(--muted)">—</td>';
      } else {
        var v = m[key];
        var barW = max > 0 ? Math.round((v/max)*100) : 0;
        var barCell = showBar
          ? '<td class="bar-cell"><div class="mini-bar-bg"><div class="mini-bar-fill" style="width:' + barW + '%"></div></div></td>'
          : '';
        tr.innerHTML = '<td class="month-col">' + MONTHS[i] + '</td><td class="val val-accent">' + fmt(v) + '</td><td class="val" style="color:var(--muted)">' + m.n + '</td>' + barCell;
      }
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
  }

  function makeMultiTable(monthly, items, key) {
    var wrap = document.createElement("div");
    wrap.className = "data-table-wrap scroll-x";
    var titleEl = document.createElement("div");
    titleEl.className = "data-table-title";
    titleEl.textContent = "Table by month";
    wrap.appendChild(titleEl);

    if (!items.length) {
      var empty = document.createElement("div");
      empty.style.padding = "24px";
      empty.style.color = "var(--muted)";
      empty.style.fontSize = "13px";
      empty.textContent = "No tags found for this year.";
      wrap.appendChild(empty);
      return wrap;
    }

    var table = document.createElement("table");
    table.className = "multi-table";

    // header
    var hRow = "<thead><tr><th>Month</th>";
    items.forEach(function(item) {
      var short = item.length > 8 ? item.slice(0,8) + "…" : item;
      hRow += "<th title='" + item + "'>" + short + "</th>";
    });
    hRow += "</tr></thead>";
    table.innerHTML = hRow;

    var tbody = document.createElement("tbody");
    monthly.forEach(function(m, i) {
      var tr = document.createElement("tr");
      if (!m) {
        var cols = '<td class="month-col">' + MONTHS[i] + '</td>';
        items.forEach(function() { cols += '<td style="color:var(--muted)">—</td>'; });
        tr.innerHTML = cols;
      } else {
        var cols = '<td class="month-col">' + MONTHS[i] + '</td>';
        items.forEach(function(item) {
          var v = m[key][item] || 0;
          cols += '<td class="val" style="color:var(--txt)">' + v.toFixed(1) + '</td>';
        });
        tr.innerHTML = cols;
      }
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
  }

  function makeLineChart(id, monthly, valFn, label, color) {
    var card = document.createElement("div");
    card.className = "chart-card";
    card.innerHTML = '<div class="chart-card-title">' + label + '</div><div class="chart-wrap"><canvas id="' + id + '"></canvas></div>';
    return card;
  }

  function makeBarChartCard(id, label) {
    var card = document.createElement("div");
    card.className = "chart-card";
    card.innerHTML = '<div class="chart-card-title">' + label + '</div><div class="chart-wrap-ribbon" id="wrap_' + id + '"><canvas id="' + id + '"></canvas></div>';
    return card;
  }

  // ── CHART RENDERERS ────────────────────────────────────
  var CHART_DEFAULTS = {
    color: "rgba(255,255,255,0.7)",
    gridColor: "rgba(255,255,255,0.06)",
    tooltipBg: "rgba(15,15,19,0.95)"
  };

  function renderChart(id, monthly, valFn, label, color) {
    var canvas = document.getElementById(id);
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    var data = monthly.map(valFn);
    var c = new Chart(ctx, {
      type: "line",
      data: {
        labels: MONTHS,
        datasets: [{
          label: label,
          data: data,
          borderColor: color,
          backgroundColor: color + "22",
          borderWidth: 2.5,
          fill: true,
          tension: 0.4,
          pointRadius: 5,
          pointBackgroundColor: color,
          pointBorderColor: "#0f0f13",
          pointBorderWidth: 2,
          spanGaps: false
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: CHART_DEFAULTS.tooltipBg,
            padding: 12,
            titleColor: "#f0efe8",
            bodyColor: color,
            callbacks: {
              label: function(ctx) { return ctx.parsed.y !== null ? label + ": " + ctx.parsed.y : "No data"; }
            }
          }
        },
        scales: {
          x: { grid: { color: CHART_DEFAULTS.gridColor }, ticks: { color: CHART_DEFAULTS.color, font: { size: 11 } } },
          y: { grid: { color: CHART_DEFAULTS.gridColor }, ticks: { color: CHART_DEFAULTS.color, font: { size: 11 } } }
        }
      }
    });
    charts[id] = c;
  }

  function renderMultiBarChart(id, monthly, items, key, baseColor) {
    var canvas = document.getElementById(id);
    if (!canvas) return;
    var wrap = document.getElementById("wrap_" + id);

    var palette = [
      "#c8b560","#6c8ebf","#b56c8e","#6cbf8e","#bf8e6c",
      "#8e6cbf","#6cbfb5","#bf6c6c","#8ebf6c"
    ];

    var PAD_L = 10, PAD_R = 10, PAD_T = 20, PAD_B = 60;

    // Build moData once — reused by draw and hit-test
    var activeMos = [];
    monthly.forEach(function(m, mi) { if (m) activeMos.push(mi); });
    if (activeMos.length < 1 || items.length < 1) {
      var ctxEmpty = canvas.getContext("2d");
      var WEmpty = wrap ? wrap.offsetWidth : 600;
      canvas.width = WEmpty;
      canvas.height = 220;
      ctxEmpty.fillStyle = "rgba(255,255,255,0.45)";
      ctxEmpty.font = "600 13px 'DM Sans', sans-serif";
      ctxEmpty.textAlign = "center";
      ctxEmpty.fillText("No tag data for this year", WEmpty / 2, 110);
      return;
    }

    var moData = activeMos.map(function(mi) {
      var m = monthly[mi];
      var vals = items.map(function(item, ii) {
        return { ii: ii, item: item, v: m[key][item] || 0 };
      });
      var total = vals.reduce(function(s,x){ return s + x.v; }, 0) || 1;
      vals.forEach(function(x){ x.n = x.v / total; });
      // sort DESC: mayor primero → se dibuja desde arriba del canvas
      vals.sort(function(a, b){ return b.v - a.v; });
      return { mi: mi, vals: vals, total: total };
    });

    function getStackedY(moIdx, chartH) {
      var d = moData[moIdx];
      var result = {};
      var cursor = PAD_T;
      d.vals.forEach(function(x) {
        var h = x.n * chartH;
        result[x.item] = { top: cursor, bot: cursor + h };
        cursor += h;
      });
      return result;
    }

    // Tooltip state
    var tooltip = { visible: false, x: 0, y: 0, lines: [] };

    function draw() {
      var W = wrap ? wrap.offsetWidth : 600;
      var mobile = W < 480;
      var tiny   = W < 340;

      var labelFontSz = mobile ? 8  : 11;
      var pctFontSz   = mobile ? 8  : 10;
      var legFontSz   = mobile ? 9  : 10;
      var legSwatchSz = mobile ? 8  : 10;
      var legGap      = mobile ? 10 : 14;
      var numLegCols  = tiny ? 2 : (mobile ? 3 : 5);
      var showPct     = !tiny;
      var rotateLabels = mobile;

      var legRows = Math.ceil(items.length / numLegCols);
      var legH    = legRows * (legFontSz + legGap) + 8;
      var moLabelH = rotateLabels ? 52 : 22;

      var PAD_T2 = 16, PAD_L2 = 6, PAD_R2 = 6;
      var PAD_B2 = moLabelH + legH + 6;
      var H = PAD_T2 + 260 + PAD_B2;

      canvas.width  = W;
      canvas.height = H;
      var ctx = canvas.getContext("2d");
      var chartW = W - PAD_L2 - PAD_R2;
      var chartH = H - PAD_T2 - PAD_B2;

      var xPos = activeMos.map(function(mi, ci) {
        return activeMos.length === 1
          ? PAD_L2 + chartW / 2
          : PAD_L2 + (ci / (activeMos.length - 1)) * chartW;
      });
      var stacks = moData.map(function(_, ci) { return getStackedY(ci, chartH); });

      // Draw ribbons
      items.forEach(function(item, ii) {
        var color = palette[ii % palette.length];
        var r = parseInt(color.slice(1,3),16);
        var g = parseInt(color.slice(3,5),16);
        var b = parseInt(color.slice(5,7),16);

        var topPts = [], botPts = [];
        stacks.forEach(function(st, ci) {
          var s = st[item] || { top: PAD_T2 + chartH/2, bot: PAD_T2 + chartH/2 };
          topPts.push({ x: xPos[ci], y: s.top });
          botPts.push({ x: xPos[ci], y: s.bot });
        });

        ctx.beginPath();
        ctx.moveTo(topPts[0].x, topPts[0].y);
        for (var ci = 0; ci < topPts.length - 1; ci++) {
          var cpx = (topPts[ci].x + topPts[ci+1].x) / 2;
          ctx.bezierCurveTo(cpx, topPts[ci].y, cpx, topPts[ci+1].y, topPts[ci+1].x, topPts[ci+1].y);
        }
        ctx.lineTo(botPts[botPts.length-1].x, botPts[botPts.length-1].y);
        for (var ci = botPts.length - 2; ci >= 0; ci--) {
          var cpx = (botPts[ci].x + botPts[ci+1].x) / 2;
          ctx.bezierCurveTo(cpx, botPts[ci+1].y, cpx, botPts[ci].y, botPts[ci].x, botPts[ci].y);
        }
        ctx.closePath();
        ctx.fillStyle = "rgba(" + r + "," + g + "," + b + ",0.78)";
        ctx.fill();
        ctx.strokeStyle = "rgba(" + r + "," + g + "," + b + ",0.95)";
        ctx.lineWidth = 1;
        ctx.stroke();
      });

      // % labels inside ribbons
      if (showPct) {
        moData.forEach(function(d, ci) {
          var st = stacks[ci];
          var minH = mobile ? 18 : 14;
          d.vals.slice(0, mobile ? 2 : 3).forEach(function(x) {
            var s = st[x.item];
            if (!s) return;
            var h = s.bot - s.top;
            if (h < minH || x.v < 1) return;
            ctx.font = "600 " + pctFontSz + "px 'DM Sans', sans-serif";
            ctx.fillStyle = "rgba(255,255,255,0.9)";
            ctx.textAlign = "center";
            ctx.fillText(x.v.toFixed(0) + "%", xPos[ci], s.top + h/2 + 4);
          });
        });
      }

      // Month labels
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      var moY = PAD_T2 + chartH + 4;
      activeMos.forEach(function(mi, ci) {
        var label = rotateLabels ? MONTHS[mi] : MONTHS_FULL[mi];
        ctx.font = "600 " + labelFontSz + "px 'DM Sans', sans-serif";
        ctx.save();
        if (rotateLabels) {
          ctx.translate(xPos[ci], moY + 6);
          ctx.rotate(-Math.PI / 3);
          ctx.textAlign = "right";
          ctx.fillStyle = "rgba(255,255,255,0.55)";
          ctx.fillText(label, 0, 0);
        } else {
          ctx.textAlign = "center";
          ctx.fillText(label, xPos[ci], moY + 14);
        }
        ctx.restore();
      });

      // Legend (responsive grid)
      var legStartY = PAD_T2 + chartH + moLabelH + 10;
      var colW = Math.floor(W / numLegCols);
      ctx.font = "500 " + legFontSz + "px 'DM Sans', sans-serif";
      items.forEach(function(item, ii) {
        var col = ii % numLegCols;
        var row = Math.floor(ii / numLegCols);
        var lx = col * colW + 6;
        var ly = legStartY + row * (legFontSz + legGap);
        var color = palette[ii % palette.length];
        var r2 = parseInt(color.slice(1,3),16);
        var g2 = parseInt(color.slice(3,5),16);
        var b2 = parseInt(color.slice(5,7),16);
        ctx.fillStyle = "rgba(" + r2 + "," + g2 + "," + b2 + ",0.9)";
        ctx.fillRect(lx, ly - legSwatchSz + 2, legSwatchSz, legSwatchSz);
        ctx.fillStyle = "rgba(255,255,255,0.65)";
        ctx.textAlign = "left";
        var maxChars = tiny ? 10 : (mobile ? 13 : 16);
        var label = item.length > maxChars ? item.slice(0, maxChars) + "…" : item;
        ctx.fillText(label, lx + legSwatchSz + 4, ly);
      });

      // Tooltip
      if (tooltip.visible) {
        var tx = tooltip.x, ty = tooltip.y;
        var tw = mobile ? 130 : 160;
        var th = 14 * tooltip.lines.length + 16;
        if (tx + tw + 12 > W) tx = tx - tw - 12; else tx = tx + 12;
        if (ty + th + 8 > PAD_T2 + chartH) ty = PAD_T2 + chartH - th - 8;
        ctx.fillStyle = "rgba(15,15,19,0.93)";
        ctx.beginPath();
        ctx.roundRect(tx, ty, tw, th, 6);
        ctx.fill();
        ctx.font = "600 11px 'DM Sans', sans-serif";
        ctx.textAlign = "left";
        tooltip.lines.forEach(function(line, li) {
          ctx.fillStyle = line.color || "rgba(255,255,255,0.85)";
          ctx.fillText(line.text, tx + 10, ty + 14 + li * 14);
        });
      }
    }

    // Hit test: find which item is at pixel (px, py)
    function hitTest(px, py, W, H) {
      var mobile = W < 480;
      var legRows = Math.ceil(items.length / (W < 340 ? 2 : (mobile ? 3 : 99)));
      var legH = legRows * (mobile ? 19 : 24) + 8;
      var moLabelH = mobile ? 52 : 22;
      var PAD_T2 = 16, PAD_L2 = 6, PAD_R2 = 6;
      var PAD_B2 = moLabelH + legH + 6;
      var chartH = H - PAD_T2 - PAD_B2;
      var chartW = W - PAD_L2 - PAD_R2;
      if (py < PAD_T2 || py > PAD_T2 + chartH) return null;

      var xPos = activeMos.map(function(mi, ci) {
        return activeMos.length === 1
          ? PAD_L2 + chartW / 2
          : PAD_L2 + (ci / (activeMos.length - 1)) * chartW;
      });
      var bestCi = 0, bestDist = Infinity;
      xPos.forEach(function(x, ci) {
        var d = Math.abs(px - x);
        if (d < bestDist) { bestDist = d; bestCi = ci; }
      });

      var stacks = moData.map(function(_, ci) { return getStackedY(ci, chartH); });
      var st = stacks[bestCi];
      var hitItem = null;
      items.forEach(function(item) {
        var s = st[item];
        if (s && py >= s.top && py <= s.bot) hitItem = item;
      });
      return hitItem ? { ci: bestCi, item: hitItem } : null;
    }

    // Mouse/touch events
    function onMove(px, py) {
      var W = canvas.width, H = canvas.height;
      var hit = hitTest(px, py, W, H);
      if (hit) {
        var d = moData[hit.ci];
        var val = d.vals.find(function(x){ return x.item === hit.item; });
        var lines = [
          { text: MONTHS_FULL[activeMos[hit.ci]], color: "rgba(255,255,255,0.5)" },
          { text: hit.item + ": " + (val ? val.v.toFixed(1) : "0") + "%", color: palette[items.indexOf(hit.item) % palette.length] }
        ];
        tooltip = { visible: true, x: px, y: py, lines: lines };
      } else {
        tooltip = { visible: false };
      }
      draw();
    }

    function getXY(e, isTouch) {
      var rect = canvas.getBoundingClientRect();
      var src = isTouch ? e.touches[0] : e;
      return { x: src.clientX - rect.left, y: src.clientY - rect.top };
    }

    canvas.addEventListener("mousemove", function(e) {
      var p = getXY(e, false); onMove(p.x, p.y);
    });
    canvas.addEventListener("mouseleave", function() {
      tooltip = { visible: false }; draw();
    });
    canvas.addEventListener("touchmove", function(e) {
      e.preventDefault();
      var p = getXY(e, true); onMove(p.x, p.y);
    }, { passive: false });
    canvas.addEventListener("touchend", function() {
      tooltip = { visible: false }; draw();
    });

    draw();
  }


}());
</script>
</body>
